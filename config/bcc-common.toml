#What this pack tells Better Compatibility Checker about itself.
#
#The mod ships "CHANGE_ME" for both of these, and the pack's own update check
#reads the version straight out of BCC: kubejs/startup_scripts/update_checker.js
#asks CurseForge for the newest All the Mods 10 file and compares. "CHANGE_ME"
#parses as a version with no numbers in it at all, so every published release
#counted as newer, and a player already on the newest one was told at every
#start that an update was available:
#
#    [KubeJS Startup]: Pack Version is: CHANGE_ME
#    [KubeJS Startup]: CF Version is: 8.2
#
#The version is the one in the CurseForge manifest this pack was built from,
#_download/update-8.2/client-manifest.json. It has to move when that does.
#
#Every other key is left to the mod: NeoForge fills in what a config does not
#name, so this stays correct across updates rather than freezing today's
#defaults.

[general]
	#The name of the modpack
	modpackName = "All the Mods 10"
	#The version of the modpack
	modpackVersion = "8.2"
